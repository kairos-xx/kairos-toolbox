# Release configuration for tools.stationer.
#
#   python -m tools.stationer plan --project district
#   district --make-release [patch|minor|major|X.Y.Z]      (front end for the above)
#
# The tag `district/v<X.Y.Z>` triggers .github/workflows/district-release.yml,
# which builds the per-platform archives and creates the GitHub release, so the
# local run neither creates the release nor publishes to PyPI.

[repository]
provider = "github"
owner = "kairos-xx"
name = "kairos-toolbox"
default_branch = "main"
visibility = "public"

[release]
tag_template = "{project}/v{version}"
publish_pypi = false
create_github_release = false
# Tests gate every release. Lint runs in CI on the tag. Hooks run from the
# project directory, hence the relative test path.
pre_hooks = [
    ["{python}", "-m", "pytest", "../../tests/tools/district", "-q"],
]

[projects.district]
path = "tools/district"
# The version is read from here; there is no second copy in this file.
version_files = ["tools/district/product.py"]
