[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-terminal"
dynamic = ["version"]
description = "Cross-platform local execution control plane for humans and coding agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Joao Lopes" }]
dependencies = [
    "arrow-local-uri>=0.1",
    "fastapi>=0.115",
    "psutil>=7.0",
    "uvicorn>=0.34",
]

[project.scripts]
lake = "lake_terminal.cli:main"

[tool.setuptools]
packages = ["lake_terminal"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "lake_terminal.__version__" }

[tool.setuptools.package-data]
lake_terminal = ["web_assets/*"]
