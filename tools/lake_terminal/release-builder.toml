# Manifest for tools.release_builder. It describes both output formats:
#
#   # self-contained .pyz for this platform (needs Python on the target;
#   # built per platform by .github/workflows/lake-release.yml)
#   python -m tools.release_builder --project tools/lake_terminal \
#       --manifest tools/lake_terminal/release-builder.toml \
#       --output dist --format pyz
#
#   # frozen native installers (need no Python on the target)
#   python -m tools.release_builder --project tools/lake_terminal \
#       --manifest tools/lake_terminal/release-builder.toml \
#       --output dist/native --platform macos
#
# Windows ARM64 additionally needs the [windows] worker below.

[project]
name = "lake"
# Read from product.py so the version has a single source.
version_file = "lake_terminal/product.py"
entrypoint = "lake_entry.py"
identifier = "dev.kairos-xx.lake-terminal"
console = true
# cli.py imports update/settings/release with importlib, which PyInstaller's
# static analysis cannot follow, and the dashboard ships data files.
pyinstaller_args = [
    "--collect-submodules", "lake_terminal",
    "--collect-data", "lake_terminal",
]
pip_args = []
# Lake imports arrow_uri; install the sibling project before Lake itself.
local_dependencies = ["../arrow"]

[pyz]
# Asset prefix the updater looks for: <name>-<version>-<platform>.pyz
name = "lake-terminal"
# Becomes the archive's __main__.py: unpacks the archive once (compiled
# dependencies cannot be imported from a zip) and runs the CLI.
bootstrap = "pyz_main.py"

[macos]
# signing_identity = "Developer ID Installer: Example (TEAMID)"

[linux]
docker_platform = "linux/arm64"
image = "python:3.13-slim-bookworm"
maintainer = "Lake Terminal maintainers"
description = "Cross-platform local execution control plane for agents"

# Only needed when building --platform windows.
# [windows]
# host = "127.0.0.1"
# port = 2222
# user = "builder"
# identity_file = "~/.ssh/windows_builder_ed25519"
# python = ["py", "-3.13"]
# remote_root = "C:/release-builder"
# publisher = "Lake Terminal maintainers"
