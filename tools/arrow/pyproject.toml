[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arrow-local-uri"
version = "0.1.0"
description = "Local URI trust, authentication, validity, tracing, and elevation framework."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Joao Lopes" }]
dependencies = ["pydantic>=2.10"]

[tool.setuptools]
packages = ["arrow_uri"]
