[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bowman"
version = "0.1.0"
description = "Local URI trust, authentication, validity, tracing, and elevation framework."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Joao Lopes" }]
dependencies = ["pydantic>=2.10"]

[tool.setuptools]
package-dir = {"bowman" = "."}
packages = ["bowman"]

[tool.distutils.bdist_wheel]
bdist-dir = "../../.build-cache/bowman/bdist"
