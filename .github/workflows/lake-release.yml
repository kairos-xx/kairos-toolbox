name: Release Lake Terminal

# Releases are cut with `lake --make-release`, which bumps Product.version,
# tags `lake-terminal/v<X.Y.Z>` and pushes. The tag prefix selects the project:
# `<project>/v<semver>` -> tools/<project with - as _>.
on:
  push:
    tags: ["lake-terminal/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.meta.outputs.project }}
      directory: ${{ steps.meta.outputs.directory }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve project and version
        id: meta
        run: |
          ref="$GITHUB_REF_NAME"
          if [[ "$ref" == */v* ]]; then
            project="${ref%%/v*}"; tag="$ref"
          else
            project="lake-terminal"; tag=""
          fi
          info=$(python -m tools.release_publish --config release.toml show --project "$project")
          version=$(jq -r .version <<<"$info")
          if [ -n "$tag" ] && [ "$tag" != "$(jq -r .tag <<<"$info")" ]; then
            echo "tag $tag does not match the project version $version" >&2
            exit 1
          fi
          {
            echo "project=$project"
            echo "directory=$(jq -r .path <<<"$info")"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Install
        run: python -m pip install -e tools/arrow -e tools/lake_terminal pytest pytest-cov httpx ruff==0.15.22
      - name: Lint
        run: ruff check tools/lake_terminal tests/tools/lake_terminal tests/conftest.py
      - name: Test
        run: python -m pytest tests/tools/lake_terminal -q

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        # One archive per platform: psutil is a compiled dependency.
        os: [macos-14, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build archive
        run: >
          python -m tools.release_builder
          --project ${{ needs.verify.outputs.directory }}
          --manifest ${{ needs.verify.outputs.directory }}/release-builder.toml
          --output dist --format pyz
      - uses: actions/upload-artifact@v4
        with:
          name: pyz-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    if: needs.verify.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      PROJECT: ${{ needs.verify.outputs.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pyz-*
          merge-multiple: true
      - name: Checksums
        run: python -m tools.release_publish.artifacts dist --name SHA256SUMS.txt
      - name: Publish release
        run: python -m tools.release_publish --config release.toml publish --project "$PROJECT" --artifacts dist
