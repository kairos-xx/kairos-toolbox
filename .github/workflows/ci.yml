name: CI

on:
  push:
  pull_request:

jobs:
  lake-terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Lake Terminal
        run: python -m pip install -e tools/lake_terminal pytest pytest-cov
      - name: Test Lake Terminal
        run: python -m pytest tests/tools/lake_terminal -q
      - name: Synthetic provider qualification
        run: lake test integration synthetic all
