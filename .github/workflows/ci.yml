name: CI

on:
  push:
  pull_request:

jobs:
  district:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 was retired by GitHub; macos-15-intel is the Intel runner.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install District Terminal
        run: python -m pip install -e tools/bowman -e tools/district pytest pytest-cov httpx ruff==0.15.22
      - name: Lint
        run: ruff check tools/district tests/tools/district tests/conftest.py
      - name: Test District Terminal
        run: python -m pytest tests/tools/district -q
      - name: Synthetic provider qualification
        run: district test integration synthetic all
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test dashboard assets
        run: node --test "tests/tools/district/js/*.test.mjs"
